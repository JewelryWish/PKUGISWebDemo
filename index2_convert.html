<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北大校园GIS - 高德API版</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        #container {
            height: 100%;
            width: 100%;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }
    </style>
    <!-- 加载高德地图 JS API 2.0，必须替换你的 Key -->
    <script type="text/javascript">
        window._AMapSecurityConfig = { securityJsCode: '4537606a9fad4d751dfa2ab51c48c469' }; // 若申请了安全密钥需配置
    </script>
    <script type="text/javascript"
        src="https://webapi.amap.com/maps?v=2.0&key=7a50d5cb6b4dc306b942085c4663f21f"></script>
</head>

<body>
    <div class="info-panel">
        <h3>北大校园GIS Demo</h3>
        <p>鼠标悬停查看要素信息</p>
    </div>
    <div id="container"></div>

    <script>
        // 1. 初始化高德地图
        const map = new AMap.Map('container', {
            zoom: 15,
            center: [116.3104, 39.9929], // 北大中心点（已转换为GCJ02）
            viewMode: '2D',
            mapStyle: 'amap://styles/normal'
        });

        // 2. 坐标转换核心函数：WGS84(GPS) -> GCJ02(高德坐标系)
        async function convertWGS84ToGCJ02(coords, geometryType) {
            // 处理不同几何类型的坐标结构，提取所有需要转换的坐标点
            let flatCoords = []; // 扁平化的坐标数组（用于批量转换）
            let coordTree = [];  // 记录坐标层级结构（用于转换后还原）
            let index = 0;

            // 递归扁平化坐标并记录层级结构
            function flattenCoords(c, level) {
                if (!coordTree[level]) coordTree[level] = [];
                // 判定是否为最终坐标点 [lng, lat]
                if (Array.isArray(c[0]) && typeof c[0][0] === 'number') {
                    flatCoords.push(c);
                    coordTree[level].push(index++);
                } else {
                    coordTree[level].push([]);
                    c.forEach((item, i) => {
                        flattenCoords(item, level + 1);
                        coordTree[level][coordTree[level].length - 1].push(i);
                    });
                }
            }

            // 根据几何类型处理坐标扁平化
            switch (geometryType) {
                case 'Point':
                    flatCoords = [coords];
                    break;
                case 'LineString':
                case 'MultiPoint':
                    flatCoords = coords;
                    break;
                case 'Polygon':
                case 'MultiLineString':
                    flattenCoords(coords, 0);
                    break;
                case 'MultiPolygon':
                    flattenCoords(coords, 0);
                    break;
                default:
                    return coords; // 不支持的类型返回原坐标
            }

            // 无坐标需转换时直接返回
            if (flatCoords.length === 0) return coords;

            // 调用高德坐标转换接口
            return new Promise((resolve) => {
                AMap.convertFrom(flatCoords, 'gps', (status, result) => {
                    if (status === 'complete' && result.info === 'ok') {
                        // 转换后的坐标数组 [AMap.LngLat, ...] -> [[lng, lat], ...]
                        const convertedCoords = result.locations.map(loc => [loc.lng, loc.lat]);

                        // 递归还原坐标层级结构
                        function restoreCoords(level, tree) {
                            let res = [];
                            tree.forEach((item, i) => {
                                if (Array.isArray(item)) {
                                    res.push(restoreCoords(level + 1, item));
                                } else {
                                    res.push(convertedCoords[item]);
                                }
                            });
                            return res;
                        }

                        // 根据几何类型还原最终坐标
                        let finalCoords;
                        if (['Point', 'LineString', 'MultiPoint'].includes(geometryType)) {
                            finalCoords = geometryType === 'Point' ? convertedCoords[0] : convertedCoords;
                        } else {
                            finalCoords = restoreCoords(0, coordTree[0]);
                        }

                        resolve(finalCoords);
                    } else {
                        console.error(`坐标转换失败: ${result.info}`, result);
                        resolve(coords); // 转换失败时使用原坐标降级
                    }
                });
            });
        }

        // 3. 加载并渲染 GeoJSON 数据
        async function loadGeoJSON() {
            try {
                const response = await fetch('./buildings_WGS84.geojson'); // 读取同文件夹下的 GeoJSON
                const geojson = await response.json();
                await renderGeoJSON(geojson); // 等待坐标转换和渲染完成
            } catch (err) {
                console.error('GeoJSON加载失败:', err);
                alert('请确保 buildings_WGS84.geojson 在同一文件夹，且用 Live Server 打开！');
            }
        }

        // 4. 核心渲染函数：遍历 GeoJSON 并添加高德覆盖物（异步版）
        async function renderGeoJSON(geojson) {
            const features = geojson.features;
            const overlays = []; // 存储所有覆盖物，方便后续控制

            // 批量处理所有要素（异步）
            const featurePromises = features.map(async (feature) => {
                const geometry = feature.geometry;
                const properties = feature.properties;
                let overlay;

                if (!geometry || !geometry.coordinates) return null;

                // 关键：转换WGS84坐标到GCJ02
                const convertedCoords = await convertWGS84ToGCJ02(geometry.coordinates, geometry.type);

                // 根据几何类型创建不同的高德覆盖物
                switch (geometry.type) {
                    case 'Polygon':
                    case 'MultiPolygon':
                        overlay = new AMap.Polygon({
                            path: convertedCoords,
                            strokeColor: '#0066cc',
                            strokeWeight: 2,
                            fillColor: '#0066cc',
                            fillOpacity: 0.3,
                            extData: properties // 把属性存到覆盖物里
                        });
                        break;
                    case 'LineString':
                    case 'MultiLineString':
                        overlay = new AMap.Polyline({
                            path: convertedCoords,
                            strokeColor: '#0066cc',
                            strokeWeight: 3,
                            extData: properties
                        });
                        break;
                    case 'Point':
                        overlay = new AMap.Marker({
                            position: convertedCoords,
                            extData: properties
                        });
                        break;
                    default:
                        return null;
                }

                if (overlay) {
                    // 添加鼠标交互
                    addOverlayEvents(overlay);
                    map.add(overlay);
                    overlays.push(overlay);
                }
                return overlay;
            });

            // 等待所有要素处理完成
            await Promise.all(featurePromises);

            // 自动缩放地图以包含所有转换后的要素
            if (overlays.length > 0) {
                map.setFitView(overlays);
            }
        }

        // 5. 添加鼠标事件（高亮 + 弹窗）
        function addOverlayEvents(overlay) {
            // 鼠标进入：高亮
            overlay.on('mouseover', function (e) {
                const target = e.target;
                if (target.setOptions) {
                    target.setOptions({
                        strokeColor: '#ff6600',
                        fillColor: '#ff6600',
                        fillOpacity: 0.6
                    });
                }

                // 显示属性弹窗
                const props = target.getExtData();
                let content = '<div style="padding:10px;"><h4>要素信息</h4>';
                for (let key in props) {
                    content += `<p><b>${key}:</b> ${props[key]}</p>`;
                }
                content += '</div>';

                const infoWindow = new AMap.InfoWindow({ content });
                infoWindow.open(map, e.lnglat);
            });

            // 鼠标移出：恢复样式
            overlay.on('mouseout', function (e) {
                const target = e.target;
                if (target.setOptions) {
                    target.setOptions({
                        strokeColor: '#0066cc',
                        fillColor: '#0066cc',
                        fillOpacity: 0.3
                    });
                }
                map.clearInfoWindow();
            });
        }

        // 启动加载
        loadGeoJSON();
    </script>
</body>

</html>
